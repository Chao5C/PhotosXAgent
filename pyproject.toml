[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photosxagent"
version = "0.1.0"
description = "Multi-agent photo management: EXIF/vision tags, journey simulation, recommendations, and a chat assistant"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "motor>=3.3.0",
    "pymongo>=4.0.0",
    "redis>=5.0.0",
    "PyJWT>=2.0.0",
    "bcrypt>=4.0.0",
    "httpx>=0.24.0",
    "aiofiles>=0.8.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.8",
    "openai>=1.0.0,<2.0.0",
]

[tool.setuptools.packages.find]
include = ["app*", "photosx*"]
